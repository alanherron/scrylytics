name: Project Field Mapper

on:
  issues:
    types: [labeled, opened]
  pull_request:
    types: [labeled, opened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CONNECT_TIMEOUT: 5
  MAX_TIME: 30
  RETRY_COUNT: 5
  RETRY_MAX_TIME: 40
  SPEED_TIME: 10
  SPEED_LIMIT: 1024
  EXPECT100_TIMEOUT: 2
  BACKOFF_BASE: 1

jobs:
  map_fields:
    runs-on: ubuntu-latest
    steps:
      - name: Map fields from labels
        uses: leonsteinhaeuser/project-beta-automations@v2.5.1
        with:
          gh_token: ${{ secrets.PROJECTS_TOKEN }}
          user: ${{ secrets.PROJECT_USER }}
          project_id: ${{ secrets.PROJECT_ID }}
          resource_node_id: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
          field_mappings: ${{ secrets.PROJECT_FIELD_MAPPINGS }}
